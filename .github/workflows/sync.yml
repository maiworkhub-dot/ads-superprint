name: Đồng bộ Meta Ads

on:
  schedule:
    # 2 tiếng một lần từ 07:00 đến 23:00 giờ Việt Nam (giờ UTC trừ 7)
    - cron: '5 0-16/2 * * *'
  workflow_dispatch:
    inputs:
      backfill_from:
        description: 'Lấy lại toàn bộ từ ngày (YYYY-MM-DD). Để trống = chỉ lấy vài ngày gần nhất.'
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore: ['site/data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lấy số liệu từ Meta
        if: github.event_name != 'push'
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
          ACCOUNT_IDS: ${{ vars.ACCOUNT_IDS }}
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
        run: node scripts/sync.mjs
      - name: Lưu số liệu vào kho
        if: github.event_name != 'push'
        run: |
          git config user.name "ads-bot"
          git config user.email "ads-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Cập nhật số liệu $(TZ=Asia/Ho_Chi_Minh date +'%d/%m %H:%M')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
